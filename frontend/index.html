<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Imagination -> Innovation -> Invention" />
    <title>TaskForge | Modern Project Management System</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var saved = localStorage.getItem('taskforge_cosmic_theme');
        if (saved === 'false') {
          document.documentElement.classList.remove('cosmic-theme');
        } else {
          document.documentElement.classList.add('cosmic-theme');
        }
      })();
    </script>
  </head>
  <body class="cosmic-theme">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
